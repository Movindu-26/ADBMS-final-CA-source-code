spring.application.name=hotel-reservation
server.port=8080

# ---- MySQL (create the database first: run database/schema.sql and database/data.sql) ----
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

# ---- JPA: the schema is created by database/schema.sql, so Hibernate must not touch it ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Show BEGIN / COMMIT / ROLLBACK in the console (evidence for transaction management) ----
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# ---- Booking behaviour ----
# true  = pessimistic lock on the room row (correct behaviour)
# false = NO lock, used only to demonstrate the double-booking problem (baseline)
booking.locking.enabled=true
# artificial pause between the overlap check and the insert; makes the race easy to reproduce (ms)
booking.demo.delay-ms=0
# allows the header "X-Simulate-Failure: true" on POST /api/reservations to prove rollback
booking.demo.simulate-failure-enabled=true
